# 公共查询是否使用用户ck  0-不使用 1-使用
allowUseCookie: 1
# 默认cookie帮助文档链接地址
cookieDoc: https://docs.qq.com/doc/DUWNVQVFTU3liTVlO

# stoken 数据目录（CK自动刷新：CK失效时用stoken换取新cookie，默认指向 Axiu-Plugin，可改为任意插件的 stoken 目录）
stokenPath: plugins/Axiu-Plugin/data/stoken/


# 别名设置权限 0-所有群员都可以添加 1-群管理员才能添加 2-主人才能添加
abbrSetAuth: 0
# 米游社攻略图默认来源设置 1-西风驿站 2-原神观测枢 3-派蒙喵喵屋 4-OH是姜姜呀
defaultSource: 1